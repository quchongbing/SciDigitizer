<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>SciDigitizer browser benchmark</title></head>
  <body>
    <pre id="output">running</pre>
    <script type="module">
      import { detectPlotRects } from "../src/core.js";

      const paths = Array.from({ length: 10 }, (_, index) => `../images/fig${index + 1}.png`);
      const results = [];
      for (const path of paths) {
        const image = new Image();
        image.src = path;
        await image.decode();
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(image, 0, 0);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const started = performance.now();
        const rects = detectPlotRects(imageData.data, canvas.width, canvas.height, { maxResults: 5 });
        results.push({
          image: path.split("/").at(-1),
          size: [canvas.width, canvas.height],
          elapsedMs: Math.round(performance.now() - started),
          rects,
        });
      }
      document.querySelector("#output").textContent = JSON.stringify(results, null, 2);
      document.title = "done";
    </script>
  </body>
</html>
