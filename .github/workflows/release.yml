name: Build and update release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Download Neutralino runtimes
        run: npm run desktop:update

      - name: Verify source and tracing logic
        run: |
          npm run check
          npm test
          npm run smoke:real

      - name: Build lightweight desktop packages
        run: npm run desktop:build

      - name: Replace assets on the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG" \
            --title "SciDigitizer v0.20.0 Preview 3 Patch 1" \
            --notes-file docs/releases/v0.20.0-preview.3.1.md \
            --prerelease
          gh release upload "$TAG" dist-desktop/releases/* --clobber
