name: Build immutable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify immutable version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match package version v$VERSION" >&2
            exit 1
          }

      - name: Download Neutralino runtimes
        run: npm run desktop:update

      - name: Verify source and tracing logic
        run: |
          npm run check
          npm test
          npm run benchmark:check
          npm run smoke:real

      - name: Verify browser workflows before packaging
        run: |
          google-chrome --version
          npm run smoke:app

      - name: Build lightweight desktop packages
        run: npm run desktop:build

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          TITLE="SciDigitizer $VERSION"
          NOTES="docs/releases/v$VERSION.md"
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then RELEASE_FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ -f "$NOTES" ]]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" "${RELEASE_FLAGS[@]}"
            else
              gh release edit "$TAG" --title "$TITLE" "${RELEASE_FLAGS[@]}"
            fi
          else
            if [[ -f "$NOTES" ]]; then
              gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file "$NOTES" "${RELEASE_FLAGS[@]}"
            else
              gh release create "$TAG" --verify-tag --title "$TITLE" --generate-notes "${RELEASE_FLAGS[@]}"
            fi
          fi
          gh release upload "$TAG" dist-desktop/releases/*
