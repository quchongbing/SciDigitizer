name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 22
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Stress-test Pen geometry and extraction
        run: npm run test:pen

      - name: Check extraction accuracy regressions
        run: npm run benchmark:check

      - name: Run real-image smoke regressions
        run: npm run smoke:real

      - name: Run browser workflows (HTTP worker and file bundle)
        # GitHub's Ubuntu runner includes Chrome; do not download a separate
        # browser or disable its sandbox for untrusted pull-request code.
        run: |
          google-chrome --version
          npm run smoke:app
